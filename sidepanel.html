<!DOCTYPE html>
<html>
<head>
  <title>AI Research Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 16px;
    }

    h1 {
      font-size: 20px;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 100px;
      padding: 10px;
      margin-top: 10px;
      margin-bottom: 10px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 10px;
      cursor: pointer;
    }

    #results {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>AI Research Assistant</h1>

  <p>What are you researching?</p>

  <textarea
    id="researchQuestion"
    placeholder="Example: What caused the American Revolution?"
  ></textarea>

  <button id="researchButton">
    Research
  </button>

  <div id="results"></div>

  <script src="sidepanel.js"></script>

</body>
</html>
